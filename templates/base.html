<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AgriConnect{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="nav">
    <a class="nav__brand" href="{{ url_for('home') }}">AgriConnect</a>
    <nav class="nav__links">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('predict') }}">Predict Price</a>
      <a href="{{ url_for('recommend') }}">Recommend Crop</a>
      <a href="{{ url_for('help_page') }}">Help</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>AgriConnect &middot; price forecasts from historical mandi data &middot; not financial advice</p>
  </footer>
</body>
</html>
